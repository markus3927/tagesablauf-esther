<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--royal:#1565C0;--dunkel:#0D3E6A;--hellblau:#D6E8F7;--akzent:#42A5F5;
 --grau:#F5F8FB;--text:#2C2C2C;--dim:#6B7B8D;--bg:#f0f4f8;--linie:#d0dce8;
 --rot:#C62828;--rot-bg:#FDECEA;--gruen:#2E7D32;--gruen-bg:#E6F4E7}
html{-webkit-text-size-adjust:100%;background:#182f83}
body{font-family:'Source Sans 3','DejaVu Sans',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.master-header{background:linear-gradient(180deg,#3f63dd,#182f83);padding-top:env(safe-area-inset-top,0px)}
.header-content{display:flex;flex-direction:column;align-items:center;padding:16px 16px 12px;text-align:center}
.header-brand{display:flex;align-items:center;justify-content:center;gap:12px}
.header-logo{height:44px;width:44px;object-fit:contain;flex:none}
.header-title{font-size:23px;font-weight:700;color:#fff;letter-spacing:.3px}
.header-title span{color:var(--hellblau)}
.header-desc{font-size:13px;color:var(--hellblau);margin-top:4px}
.accent-line{height:3px;background:var(--akzent)}
.container{max-width:560px;margin:0 auto;padding:14px 14px 6px}
.daybar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.daybar button{flex:none;width:48px;height:48px;border-radius:12px;border:1.5px solid var(--linie);background:#fff;color:var(--royal);font-size:22px;font-weight:700}
.daybar button:disabled{color:#c3d0de}
.daybar .day{flex:1;text-align:center}
.daybar .day b{display:block;font-size:20px;color:var(--dunkel)}
.daybar .day small{font-size:13.5px;color:var(--dim)}
.section{background:#fff;box-shadow:0 2px 8px rgba(13,62,106,.08);padding:14px;margin-bottom:14px;border-left:4px solid var(--royal);border-radius:12px;overflow:hidden}
.section-title{background:var(--royal);color:#fff;font-weight:700;font-size:13px;padding:7px 12px;margin:-14px -14px 12px -14px;letter-spacing:.4px;text-align:center;text-transform:uppercase}
.slot{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #e6edf4}
.slot:first-of-type{border-top:none;padding-top:2px}
.slot-time{flex:none;width:62px;font-family:'Source Code Pro',monospace;font-weight:700;font-size:19px;color:var(--dunkel)}
.slot-body{flex:1;min-width:0}
.medi{font-size:15.5px;font-weight:600;line-height:1.3}
.medi small{display:block;font-weight:400;color:var(--dim);font-size:13px}
.medi+.medi{margin-top:5px}
.slot-state{font-size:13px;font-weight:700;margin-top:5px}
.slot-state.ok{color:var(--gruen)}.slot-state.no{color:var(--rot)}.slot-state.due{color:var(--rot)}.slot-state.next{color:var(--royal)}
.tick{flex:none;width:78px;min-height:64px;border-radius:14px;border:2px solid var(--royal);background:#fff;color:var(--royal);font-size:11px;letter-spacing:-.2px;font-weight:700;line-height:1.15;padding:6px 2px}
.tick svg{display:block;margin:0 auto 3px;width:26px;height:26px}
  .tick.ok,.tick.no{font-size:13px}
.tick.ok{background:var(--gruen);border-color:var(--gruen);color:#fff}
.tick.no{background:var(--rot-bg);border-color:var(--rot);color:var(--rot)}
.slot.is-next{background:#eef5fd;margin:0 -14px;padding-left:14px;padding-right:14px}
.btn{min-height:52px;border-radius:12px;padding:12px 16px;font-size:16.5px;font-weight:700;border:none;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.btn svg{width:22px;height:22px;flex:none}
.btn-pri{background:linear-gradient(135deg,var(--royal),#0d47a1);color:#fff}
.btn-pri:disabled{background:#9fb6cf}
.btn-sec{background:#fff;color:var(--royal);border:1.5px solid var(--royal)}
.btn-rot{background:#fff;color:var(--rot);border:1.5px solid var(--rot)}
.btn-wa{background:#1FA855;color:#fff}
.btn+.btn{margin-top:10px}
.btn-ok{background:var(--gruen);color:#fff}
.duo{display:flex;gap:8px;margin-top:10px}
.duo .btn{margin-top:0;flex:1 1 0;min-width:0;width:auto;min-height:48px;font-size:14.5px;padding:8px 4px;gap:5px;line-height:1.15}
.duo .btn svg{width:19px;height:19px}
.dots{display:flex;gap:7px;margin:10px 0 12px}
.dots i{flex:1;height:12px;border-radius:6px;background:#e3ecf4}
.dots i.on{background:var(--royal)}
.dots.full i.on{background:var(--rot)}
.cnt{font-size:15px;color:var(--dim)}
.cnt b{font-family:'Source Code Pro',monospace;font-size:19px;color:var(--dunkel)}
.warn{font-size:14px;font-weight:600;color:var(--rot);background:var(--rot-bg);border-radius:8px;padding:9px 12px;margin-bottom:10px;line-height:1.4}
.note{font-size:13.5px;color:var(--dim);line-height:1.5;background:var(--grau);border:1px solid #e3ecf4;border-radius:8px;padding:10px 12px}
.ev{border-top:1px solid #e6edf4;padding:12px 0}
.ev:first-of-type{border-top:none;padding-top:2px}
.ev-head{display:flex;align-items:baseline;gap:10px}
.ev-head .t{font-family:'Source Code Pro',monospace;font-weight:700;font-size:17px;color:var(--dunkel)}
.ev-head .m{font-weight:700;font-size:15.5px;flex:1}
.ev-head button{background:none;border:none;color:var(--royal);font-weight:700;font-size:14px;padding:6px 2px;text-decoration:underline}
.ev-row{font-size:14.5px;line-height:1.45;margin-top:4px}
.ev-row span{color:var(--dim);font-weight:600}
.ev-row.trig{background:#eef5fd;border-radius:8px;padding:7px 10px;margin:8px 0 6px;font-weight:600}
.ev-row.trig span{color:var(--royal)}
.ev-row.trig.offen{background:var(--rot-bg)}
.ev-row.trig.offen button{background:none;border:none;color:var(--rot);font-weight:700;font-size:14.5px;text-decoration:underline;padding:2px 0;text-align:left}
.trig-det{font-size:13px;color:var(--dim);margin-top:3px}
.slot-bef{padding:0 0 12px}
.slot-bef .helped{margin-top:0}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#e3ecf4;margin-top:4px}
.stack i{display:block;height:100%}
.stack .g{background:var(--gruen)}.stack .m{background:#E9A23B}.stack .s{background:var(--rot)}
.helped{margin-top:9px;background:var(--grau);border-radius:10px;padding:9px 10px}
.helped p{font-size:14px;font-weight:700;color:var(--dunkel);margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:9px 14px;border:1.5px solid #cfdbe8;background:#fff;border-radius:10px;font-size:15.5px;color:var(--text);text-align:left;line-height:1.3;max-width:100%}
.chip.on{background:linear-gradient(135deg,var(--royal),#0d47a1);border-color:var(--royal);color:#fff;font-weight:600}
.chip.sm{min-height:40px;padding:7px 12px;font-size:14.5px}
.q{font-weight:700;font-size:17px;color:var(--dunkel);margin:18px 0 3px;line-height:1.3}
.q:first-child{margin-top:0}
.q-hint{font-size:13px;color:var(--dim);margin-bottom:9px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{min-height:50px;border:1.5px solid #cfdbe8;background:#fff;border-radius:10px;font-size:18px;font-weight:700;font-family:'Source Code Pro',monospace;color:var(--dunkel)}
.scale button.on{background:linear-gradient(135deg,var(--royal),#0d47a1);border-color:var(--royal);color:#fff}
.scale-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-top:6px}
.input{width:100%;padding:13px 14px;border:2px solid var(--linie);border-radius:10px;font-size:17px;font-family:inherit;color:var(--text);background:#fff}
textarea.input{min-height:84px;resize:vertical;line-height:1.45}
.input:focus{outline:none;border-color:var(--royal)}
button:focus-visible{outline:3px solid var(--akzent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.tile{background:var(--grau);border:1px solid #e3ecf4;border-radius:10px;padding:10px 6px;text-align:center;font-size:12px;color:var(--dim);line-height:1.3}
.tile b{display:block;font-family:'Source Code Pro',monospace;font-size:22px;color:var(--dunkel)}
.bars{display:flex;align-items:flex-end;gap:3px;height:96px;margin:6px 0 4px}
.bars div{flex:1;background:var(--royal);border-radius:3px 3px 0 0;min-height:2px}
.bars div.z{background:#dbe6f0}
.bars div.max{background:var(--rot)}
.bars-x{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.rank{margin-top:2px}
.rank-row{margin-top:9px}
.rank-row .l{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;font-weight:600}
.rank-row .l b{font-family:'Source Code Pro',monospace;color:var(--dunkel)}
.rank-row .b{height:8px;border-radius:4px;background:#e3ecf4;margin-top:4px;overflow:hidden}
.rank-row .b i{display:block;height:100%;background:var(--akzent)}
.sub{font-size:13.5px;font-weight:700;color:var(--dunkel);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 0}
.sub:first-child{margin-top:0}
.empty{font-size:15px;color:var(--dim);line-height:1.5;text-align:center;padding:8px 4px}
.hday{font-size:16px;font-weight:700;color:var(--dunkel);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hday small{font-weight:600;color:var(--dim);font-size:13px}
.hdoses{font-size:13.5px;color:var(--dim);line-height:1.6;margin:6px 0 2px}
.hdoses b{font-family:'Source Code Pro',monospace;color:var(--text);font-size:13px}
.hdoses .no{color:var(--rot);font-weight:700}
.footer{background:linear-gradient(180deg,#2a48b0,#182f83);color:var(--hellblau);text-align:center;padding:16px 16px 18px;font-size:12px;line-height:1.6;margin-top:10px}
.footer img{height:34px;width:34px;display:block;margin:0 auto 6px}
.footer b{color:#fff;font-size:13px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #d6e0ea;box-shadow:0 -2px 10px rgba(13,62,106,.08);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar-in{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:none;padding:9px 4px 8px;font-size:13px;font-weight:700;color:var(--dim);min-height:62px}
.tab svg{display:block;margin:0 auto 3px;width:25px;height:25px}
.tab.on{color:var(--royal)}
.sheet-bg{position:fixed;inset:0;background:rgba(13,30,70,.55);z-index:40;display:none}
.sheet-bg.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 28px);background:var(--bg);border-radius:18px 18px 0 0;z-index:41;display:none;flex-direction:column;max-width:560px;margin:0 auto}
.sheet.show{display:flex}
.sheet.small{top:auto;max-height:92vh}
.sheet-head{background:linear-gradient(180deg,#3f63dd,#182f83);color:#fff;border-radius:18px 18px 0 0;padding:14px 16px;display:flex;align-items:center;gap:10px}
.sheet-head h2{flex:1;font-size:19px;line-height:1.25}
.sheet-head button{background:rgba(255,255,255,.16);border:none;color:#fff;width:42px;height:42px;border-radius:10px;font-size:22px;font-weight:700}
.sheet-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid #d6e0ea}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dunkel);color:#fff;padding:11px 18px;border-radius:24px;font-size:15px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.link{background:none;border:none;color:var(--rot);font-size:14px;font-weight:600;text-decoration:underline;padding:12px 4px;display:block;margin:0 auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function z2(n){ return (n<10?'0':'')+n; }

function jetzt(){ var d=new Date(); return z2(d.getHours())+':'+z2(d.getMinutes()); }

/* ---------- Heute ---------- */
function slotInfo(tag,p){
  var e=(S.dosen[tag]||{})[p.id];
  if(e && e.s==='g'){ var d=min(e.t)-min(p.zeit); return {s:'g', t:e.t, b:e.b||'', diff:d, spaet:Math.abs(d)>TOLERANZ_MIN}; }
  if(e && e.s==='n') return {s:'n'};
  return {s:''};
}
function vHeute(){
  var tag=ui.tag, istHeute=tag===heute(), h='';
  h+='<div class="daybar"><button type="button" data-nav="-1" aria-label="Tag zurück">&#8249;</button><div class="day"><b>'+tagName(tag)+'</b><small>'+tagLang(tag)+'</small></div><button type="button" data-nav="1" aria-label="Tag vor"'+(istHeute?' disabled':'')+'>&#8250;</button></div>';

  var naechst=null, nowM=min(jetzt());
  if(istHeute) for(var i=0;i<PLAN.length;i++){ if(!slotInfo(tag,PLAN[i]).s){ naechst=PLAN[i].id; break; } }
  h+='<div class="section"><div class="section-title">Fester Plan</div>';
  PLAN.forEach(function(p){
    var inf=slotInfo(tag,p), st='', cls='', knopf, ev=planEv(tag,p.id);
    var fragen = ev ? '<button class="btn btn-sec" type="button" data-edit="'+ev.id+'">Antworten ändern</button>'
                    : '<button class="btn btn-sec" type="button" data-fragen="p'+p.id+'">Fragen beantworten</button>';
    if(inf.s==='g'){ st='<div class="slot-state ok">Genommen um '+inf.t+(inf.spaet?' · '+abw(inf.diff):'')+'</div>'; knopf='<button class="btn btn-ok" type="button" data-slot="'+p.id+'" aria-label="genommen um '+inf.t+', ändern">'+ICON.check+inf.t+'</button>'; }
    else if(inf.s==='n'){ st='<div class="slot-state no">Nicht genommen</div>'; knopf='<button class="btn btn-rot" type="button" data-slot="'+p.id+'">ändern</button>'; }
    else {
      if(p.id===naechst){ cls=' is-next'; var d=nowM-min(p.zeit);
        st = d>TOLERANZ_MIN ? '<div class="slot-state due">Noch offen seit '+p.zeit+'</div>' : '<div class="slot-state next">Als Nächstes</div>'; }
      knopf='<button class="btn btn-pri" type="button" data-take="'+p.id+'">'+ICON.check+'Genommen</button>';
    }
    h+='<div class="slot'+cls+'"><div class="slot-time">'+p.zeit+'</div><div class="slot-body">'+p.medis.map(function(m){return '<div class="medi">'+esc(m[0])+'<small>'+esc(m[1])+'</small></div>';}).join('')+st+
      '<div class="duo">'+knopf+fragen+'</div>'+
      (inf.s?'':'<button type="button" data-slot="'+p.id+'" style="background:none;border:none;color:var(--dim);font-size:13px;text-decoration:underline;padding:8px 0 2px;text-align:left;display:block">nicht genommen</button>')+'</div></div>';
  });
  h+='</div>';

  var n=bedarfAnz(tag), voll=n>=BEDARF.max;
  h+='<div class="section"><div class="section-title">Bei Bedarf</div><div class="medi" style="font-size:17px">'+esc(BEDARF.name)+'<small>bei Bedarf, höchstens '+BEDARF.max+' mal am Tag</small></div>';
  h+='<div class="dots'+(voll?' full':'')+'">'; for(var k=0;k<BEDARF.max;k++) h+='<i'+(k<n?' class="on"':'')+'></i>'; h+='</div>';
  h+='<p class="cnt" style="margin-bottom:12px"><b>'+n+'</b> von <b>'+BEDARF.max+'</b> '+(istHeute?'heute':'an diesem Tag')+' genommen</p>';
  if(voll) h+='<div class="warn">Die '+BEDARF.max+' Einnahmen laut Verordnung sind für diesen Tag erreicht.</div>';
  h+='<button class="btn btn-pri" type="button" data-neu="'+BEDARF.id+'"'+(voll?' disabled':'')+'>'+ICON.plus+'Bedarf genommen – Auslöser eintragen</button>';
  h+='<button class="btn btn-sec" type="button" data-neu="">'+ICON.herz+'Stress / Angst festhalten</button>';
  h+='<p class="q-hint" style="margin:8px 0 0;text-align:center">ohne Medikament: Krise und Auslöser festhalten</p></div>';

  var evs=evTag(tag);
  h+='<div class="section"><div class="section-title">Einträge '+(istHeute?'heute':'an diesem Tag')+'</div>';
  h+= evs.length ? evs.map(evHtml).join('') : '<p class="empty">Noch kein Eintrag.</p>';
  h+='</div>';

  h+='<div class="section"><div class="section-title">Weitere Medikamente</div>';
  WEITERE.forEach(function(w){
    var on=(S.weit[tag]||{})[w.id];
    var wev=S.ev.filter(function(e){return e.d===tag && e.med==='w'+w.id;})[0];
    h+='<div class="slot"><div class="slot-body"><div class="medi">'+esc(w.name)+'<small>'+esc(w.hinweis)+'</small></div>'+(on?'<div class="slot-state ok">Genommen um '+on+'</div>':'')+
      '<div class="duo">'+(on?'<button class="btn btn-ok" type="button" data-weit="'+w.id+'" aria-label="'+esc(w.name)+' wieder leeren">'+ICON.check+on+'</button>':'<button class="btn btn-pri" type="button" data-weit="'+w.id+'">'+ICON.check+'Genommen</button>')+
      (wev?'<button class="btn btn-sec" type="button" data-edit="'+wev.id+'">Antworten ändern</button>':'<button class="btn btn-sec" type="button" data-fragen="w'+w.id+'">Fragen beantworten</button>')+'</div></div></div>';
  });
  h+='</div>';
  h+='<p class="note" style="margin-bottom:8px">Plan gemäss Einnahmeplan der Neurologie vom '+PLAN_STAND+'. Diese App erinnert nicht von selbst, sie hält nur fest.</p>';
  return h;
}
function evHtml(e){

  if(e.vor&&e.vor.length) h+='<div class="ev-row trig"><span>Auslöser: </span>'+esc(labels(VORHER,e.vor).join(', '))+(e.wann?' · '+label(WANN,e.wann):'')+'</div>';

/* ---------- Verlauf ---------- */
function tageMitDaten(){
  var set={}; Object.keys(S.dosen).forEach(function(d){ if(Object.keys(S.dosen[d]).length) set[d]=1; });
  Object.keys(S.weit).forEach(function(d){ if(Object.keys(S.weit[d]).length) set[d]=1; });
  S.ev.forEach(function(e){ set[e.d]=1; });
  return Object.keys(set).sort().reverse();
}
function dosenZeile(tag){
  return PLAN.map(function(p){ var i=slotInfo(tag,p);
    return p.zeit+' '+p.kurz+' '+(i.s==='g'?'<b>'+(i.spaet?i.t:'✓')+'</b>':(i.s==='n'?'<span class="no">nicht</span>':'–')); }).join(' &nbsp;·&nbsp; ');
}
function vVerlauf(){
  var tage=tageMitDaten().slice(0,60);
  if(!tage.length) return '<div class="section"><div class="section-title">Verlauf</div><p class="empty">Hier erscheinen die Tage, sobald etwas eingetragen ist.</p></div>';

    var evs=evTag(tag), n=bedarfAnz(tag);
    return '<div class="section"><div class="hday"><span>'+tagName(tag)+', '+tagKurz(tag)+'</span><small>Bedarf '+n+' von '+BEDARF.max+'</small></div><div class="hdoses">'+dosenZeile(tag)+'</div>'+evs.map(evHtml).join('')+
      '<button class="btn btn-sec" type="button" data-goto="'+tag+'" style="min-height:44px;font-size:15px;margin-top:10px">Diesen Tag öffnen</button></div>';
  }).join('');

/* ---------- Auswertung ---------- */
function auswerten(n){
  var bis=heute(), tage=[], i; for(i=n-1;i>=0;i--) tage.push(plus(bis,-i));
  var set={}; tage.forEach(function(t){set[t]=1;});
  var evs=S.ev.filter(function(e){return set[e.d];});
  var bed=evs.filter(istBed), ohne=evs.filter(function(e){return !e.med;}), plEv=evs.filter(istPlan);
  var bef=PLAN.map(function(p){ var o={zeit:p.zeit+' '+p.kurz,g:0,m:0,s:0}; tage.forEach(function(t){ var r=(S.dosen[t]||{})[p.id]; if(r&&r.b&&o[r.b]!==undefined) o[r.b]++; }); o.n=o.g+o.m+o.s; return o; });
  var gz={}; tage.forEach(function(t){ PLAN.forEach(function(p){ var r=(S.dosen[t]||{})[p.id]; if(r&&r.gr) gz[r.gr]=(gz[r.gr]||0)+1; }); });
  var grund=Object.keys(gz).map(function(k){return [label(GRUND,k),gz[k]];}).sort(function(a,b){return b[1]-a[1];});
  var befN=bef.reduce(function(x,o){return x+o.n;},0);
  function zaehl(feld,liste,quelle){ var c={}; quelle.forEach(function(e){(e[feld]||[]).forEach(function(k){c[k]=(c[k]||0)+1;});});
    return Object.keys(c).map(function(k){return [label(liste,k),c[k]];}).sort(function(a,b){return b[1]-a[1];}); }
  var proTag=tage.map(function(t){return bedarfAnz(t);});
  var zeiten=[['Nacht (0–6 Uhr)',0,360],['Morgen (6–10 Uhr)',360,600],['Vormittag (10–12 Uhr)',600,720],['Mittag (12–14 Uhr)',720,840],['Nachmittag (14–18 Uhr)',840,1080],['Abend (18–24 Uhr)',1080,1441]];
  var tz=zeiten.map(function(z){return [z[0],bed.filter(function(e){var m=min(e.t);return m>=z[1]&&m<z[2];}).length];}).filter(function(z){return z[1];});
  var fest={p:0,v:0,n:0,o:0,tage:0};
  tage.forEach(function(t){ var d=S.dosen[t]; if(!d||!Object.keys(d).length) return; fest.tage++;
    PLAN.forEach(function(p){ var inf=slotInfo(t,p); if(inf.s==='g'){ if(inf.spaet) fest.v++; else fest.p++; } else if(inf.s==='n') fest.n++; else fest.o++; }); });
  var w={ja:0,etwas:0,nein:0}; bed.forEach(function(e){ if(w[e.wirk]!==undefined) w[e.wirk]++; });
  var st=evs.filter(function(e){return e.st;}), stM=st.length?st.reduce(function(a,e){return a+e.st;},0)/st.length:0;
  var am={}; evs.forEach(function(e){ (e.vor||[]).forEach(function(k){ var o=am[k]=am[k]||{n:0,st:0,stN:0,w:{}}; o.n++; if(e.st){o.st+=e.st;o.stN++;} (e.warum||[]).forEach(function(x){o.w[x]=(o.w[x]||0)+1;}); }); });
  var ausl=Object.keys(am).map(function(k){ var o=am[k], top=Object.keys(o.w).sort(function(x,y){return o.w[y]-o.w[x];})[0];
    return {name:label(VORHER,k), n:o.n, st:o.stN?o.st/o.stN:0, top:top?label(WARUM,top):''}; }).sort(function(x,y){return y.n-x.n;});
  var ohneAusl=evs.filter(function(e){return !(e.vor&&e.vor.length);}).length;
  return {grund:grund, bef:bef, befN:befN, plan:plEv.length, ausl:ausl, ohneAusl:ohneAusl, n:n, von:tage[0], bis:bis, tage:tage, proTag:proTag, bed:bed.length, ohne:ohne.length, tageMit:proTag.filter(function(x){return x>0;}).length,
    vor:zaehl('vor',VORHER,evs), warum:zaehl('warum',WARUM,evs), wo:zaehl('wo',WO,evs), tz:tz, fest:fest, wirk:w, stM:stM, alle:evs.length};
}
function rang(titel,arr,max){
  if(!arr.length) return '';
  var top=Math.max.apply(null,arr.map(function(x){return x[1];}));
  return '<p class="sub">'+titel+'</p><div class="rank">'+arr.slice(0,max||6).map(function(x){return '<div class="rank-row"><div class="l"><span>'+esc(x[0])+'</span><b>'+x[1]+'×</b></div><div class="b"><i style="width:'+Math.round(x[1]/top*100)+'%"></i></div></div>';}).join('')+'</div>';
}
function auslDet(x){ var d=[]; if(x.top) d.push('meist: '+x.top); if(x.st) d.push('Stärke im Schnitt '+x.st.toFixed(1).replace('.',',')+' von 5'); return d.join(' · '); }
function vAusw(){
  var a=auswerten(ui.spanne), h='';
  h+='<div class="chips" style="margin-bottom:12px">'+[7,14,30].map(function(n){return '<button class="chip'+(ui.spanne===n?' on':'')+'" type="button" style="flex:1;text-align:center" data-spanne="'+n+'">'+n+' Tage</button>';}).join('')+'</div>';
  h+='<div class="section"><div class="section-title">Meine Auslöser</div>';
  if(!a.ausl.length) h+='<p class="empty">Noch kein Auslöser eingetragen. Bei jedem Bedarf oder jeder Krise zuerst den Auslöser antippen – nach ein paar Tagen zeigt sich hier das Muster.</p>';

    h+='<p class="q-hint" style="margin-bottom:0">Aus '+a.alle+' Einträgen'+(a.ohneAusl?' · bei '+a.ohneAusl+' ist der Auslöser noch offen':'')+'</p><div class="rank">'+a.ausl.slice(0,8).map(function(x){ var d=auslDet(x);
